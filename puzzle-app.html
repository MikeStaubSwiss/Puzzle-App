<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puzzle-App</title>
<style>
  :root {
    --violet-50: #f5f3ff;
    --violet-100: #ede9fe;
    --violet-200: #ddd6fe;
    --violet-300: #c4b5fd;
    --violet-400: #a78bfa;
    --violet-600: #7c3aed;
    --violet-700: #6d28d9;
    --amber-400: #fbbf24;
    --amber-500: #f59e0b;
    --amber-600: #d97706;
    --emerald-600: #059669;
    --emerald-700: #047857;
    --rose-50: #fff1f2;
    --rose-200: #fecdd3;
    --rose-500: #f43f5e;
    --rose-600: #e11d48;
    --teal-500: #14b8a6;
    --teal-600: #0d9488;
    --slate-400: #94a3b8;
    --slate-500: #64748b;
    --slate-600: #475569;
    --slate-900: #0f172a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--slate-900);
    background-color: var(--violet-50);
    background-image:
      radial-gradient(circle, var(--violet-400) 1.6px, transparent 1.6px),
      radial-gradient(circle, var(--amber-400) 1.6px, transparent 1.6px),
      radial-gradient(circle, #34d399 1.6px, transparent 1.6px),
      radial-gradient(circle, #fb7185 1.6px, transparent 1.6px);
    background-size: 56px 56px, 56px 56px, 56px 56px, 56px 56px;
    background-position: 0 0, 28px 14px, 14px 38px, 42px 46px;
    min-height: 100vh;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 32px 20px; }
  .loading {
    display: flex; align-items: center; justify-content: center;
    height: 260px; color: var(--violet-400); font-size: 14px;
  }
  header { margin-bottom: 24px; }
  h1 {
    font-size: 28px; font-weight: 800; letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 10px; margin: 0;
  }
  .title-gradient {
    background: linear-gradient(90deg, var(--amber-500), var(--rose-500), var(--violet-600));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { color: var(--slate-500); font-size: 14px; margin: 6px 0 0; max-width: 460px; }
  .card {
    background: #fff; border: 1px solid var(--violet-100); border-radius: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04); padding: 16px; margin-bottom: 20px;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  button {
    font-family: inherit; font-size: 14px; font-weight: 600; border: none;
    border-radius: 8px; padding: 10px 18px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px; transition: background .15s;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-violet { background: var(--violet-600); color: #fff; }
  .btn-violet:hover:not(:disabled) { background: var(--violet-700); }
  .btn-amber { background: var(--amber-500); color: #fff; }
  .btn-amber:hover:not(:disabled) { background: var(--amber-600); }
  .btn-emerald { background: var(--emerald-600); color: #fff; }
  .btn-emerald:hover:not(:disabled) { background: var(--emerald-700); }
  .btn-outline-rose { background: #fff; color: var(--rose-600); border: 1px solid var(--rose-200); }
  .btn-outline-rose:hover { background: var(--rose-50); }
  .btn-outline {
    background: #fff; color: var(--slate-600); border: 1px solid var(--violet-200);
    font-weight: 500; padding: 8px 14px; font-size: 13px;
  }
  .btn-outline:hover:not(:disabled) { background: var(--violet-50); }
  .btn-teal { background: var(--teal-500); color: #fff; }
  .btn-teal:hover:not(:disabled) { background: var(--teal-600); }
  .dims { font-family: var(--mono); font-size: 13px; color: var(--slate-500); }
  .preview, .piece-preview {
    width: 100%; height: 220px; border-radius: 10px; border: 1px solid var(--violet-100);
    display: block; object-fit: contain; box-sizing: border-box;
  }
  .piece-preview { background: var(--violet-50); }
  .empty-box, .piece-empty-box {
    width: 100%; height: 220px; display: flex; align-items: center; justify-content: center; gap: 8px;
    color: var(--violet-300); border: 2px dashed var(--violet-200); border-radius: 10px;
    font-size: 14px; box-sizing: border-box; text-align: center; padding: 8px;
  }
  .upload-preview-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 14px; }
  .main-preview-col, .piece-preview-col { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 10px; }
  .col-header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .upload-btn { width: 168px; justify-content: center; flex-shrink: 0; }
  .cell-info.err-msg, .err-msg { color: var(--rose-600); font-weight: 600; }
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--slate-600); }
  input[type=number] {
    font-family: var(--mono); font-size: 14px; border: 1px solid var(--violet-200);
    border-radius: 8px; padding: 7px 10px; outline: none; width: 90px;
  }
  input[type=number]:focus { border-color: var(--violet-400); box-shadow: 0 0 0 3px rgba(124,58,237,0.15); }
  .times { color: var(--violet-300); font-size: 18px; padding-bottom: 6px; }
  .total { font-size: 14px; color: var(--slate-600); padding-bottom: 6px; }
  .total b { font-family: var(--mono); color: var(--violet-700); }
  .spacer { margin-left: auto; }
  [hidden] { display: none !important; }

  /* Raster-Overlay auf dem Bild */
  .grid-toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 12px 16px; background: var(--violet-50); border-bottom: 1px solid var(--violet-100);
  }
  .cell-info { font-size: 13px; font-family: var(--mono); color: var(--slate-600); }
  /* Rasteranzeige bricht aus der schmalen Seitenspalte aus und nutzt die Fensterbreite */
  #gridSection { width: min(1600px, calc(100vw - 40px)); position: relative; left: 50%; transform: translateX(-50%); }
  /* Rasterbild in scrollbarem Bereich; Zoom vergrößert den Inhalt, Zeilen-/Spaltennummern bleiben sichtbar */
  .grid-scroll { overflow: auto; max-height: 75vh; }
  #gridFrame { width: calc(var(--zoom, 1) * 100%); }
  .zoom-box { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .zoom-box button { min-width: 34px; padding: 6px 10px; }
  .zoom-box .cell-info { min-width: 44px; text-align: center; }
  .grid-frame { padding: 16px; }
  .body-row { display: flex; }
  .image-wrapper {
    position: relative; flex: 1; line-height: 0; border-radius: 8px;
    overflow: hidden; border: 1px solid var(--violet-100); cursor: crosshair;
  }
  .image-wrapper img { width: 100%; display: block; user-select: none; }
  .grid-overlay { position: absolute; inset: 0; pointer-events: none; }
  .highlight-rect {
    position: absolute; border: 2.5px solid var(--amber-500);
    background: rgba(245, 158, 11, 0.18); box-shadow: 0 0 0 2px rgba(255,255,255,0.65);
    pointer-events: none; transition: left .15s ease, top .15s ease, width .15s ease, height .15s ease;
  }
  .search-match {
    position: absolute; box-sizing: border-box; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #ca8a04; background: rgba(250, 204, 21, 0.55);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.7);
  }
  .piece-pose {
    position: absolute; box-sizing: border-box; pointer-events: none; z-index: 3;
    border: 2px dashed #ea580c; box-shadow: 0 0 0 1px rgba(255,255,255,0.85);
  }
  .search-match .pct {
    font-size: 11px; font-weight: 700; color: #422006; line-height: 1;
    text-shadow: 0 0 3px rgba(255,255,255,0.9);
  }

  .result-box { border-top: 1px solid var(--violet-100); padding: 12px 16px 16px; background: #fffdf3; }
  .result-title { font-size: 13px; font-weight: 700; color: var(--slate-600); margin-bottom: 8px; }
  .result-list { max-width: 900px; list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .result-item {
    display: grid; grid-template-columns: 26px 76px 92px 1fr 52px; align-items: center; gap: 10px;
    padding: 5px 8px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .result-item:hover { background: #fef9c3; }
  .result-rank {
    width: 22px; height: 22px; border-radius: 50%; background: #facc15; color: #422006;
    font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center;
  }
  .result-thumb {
    width: 76px; height: 58px; object-fit: contain; display: block; border-radius: 6px;
    border: 1px solid var(--violet-100); background: #fff;
  }
  .result-name { font-family: var(--mono); color: var(--slate-600); white-space: nowrap; }
  .result-bar { height: 8px; border-radius: 4px; background: #f1f5f9; overflow: hidden; }
  .result-bar > i { display: block; height: 100%; background: #eab308; border-radius: 4px; }
  .result-pct { font-family: var(--mono); font-weight: 700; text-align: right; color: #422006; }

  .actions { border-top: 4px solid var(--amber-400); padding-top: 16px; display: flex; align-items: center; gap: 12px; }
  .status-msg { font-size: 14px; color: var(--slate-500); }
</style>
</head>
<body>
  <div id="loadingScreen" class="loading">Projekt wird geladen...</div>

  <div class="wrap" id="mainApp" hidden>
    <header>
      <h1><span>🧩</span><span class="title-gradient">Puzzle-App</span></h1>
      <p>Bild hochladen und ein Raster aus Zeilen &amp; Spalten darüberlegen.</p>
    </header>

    <section class="card">
      <div class="upload-preview-row">
        <div class="main-preview-col">
          <div class="col-header">
            <button class="btn-violet upload-btn" id="pickImageBtn">📁 Bild wählen</button>
            <input type="file" accept="image/*" id="fileInput" hidden>
            <span class="dims" id="dimsLabel" hidden></span>
          </div>
          <img id="previewImg" class="preview" hidden>
          <div class="empty-box" id="emptyBox">🖼️ Noch kein Bild ausgewählt</div>
        </div>
        <div class="piece-preview-col">
          <button class="btn-violet upload-btn" id="pickPieceBtn">🧩 Teil wählen</button>
          <input type="file" accept="image/*" id="pieceInput" hidden>
          <img id="piecePreview" class="piece-preview" hidden>
          <div class="piece-empty-box" id="pieceEmptyBox">🧩 Kein Teil ausgewählt</div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="row">
        <label class="field">
          Zeilen (X)
          <input type="number" id="xCount" min="1" max="500" value="40">
        </label>
        <span class="times">×</span>
        <label class="field">
          Spalten (Y)
          <input type="number" id="yCount" min="1" max="500" value="50">
        </label>
        <div class="total">= <b id="totalCount">2000</b> Felder</div>
        <button class="btn-amber spacer" id="createGridBtn" disabled>🧩 Raster anzeigen</button>
        <button class="btn-teal" id="searchBtn" disabled>🔍 Suchen</button>
      </div>
    </section>

    <section class="card" id="gridSection" hidden style="padding:0;">
      <div class="grid-toolbar">
        <span class="cell-info" id="cellInfo"></span>
        <div class="zoom-box">
          <button class="btn-outline" id="zoomOutBtn" title="Verkleinern">−</button>
          <span class="cell-info" id="zoomLabel">100 %</span>
          <button class="btn-outline" id="zoomInBtn" title="Vergrößern">+</button>
        </div>
        <button class="btn-outline" id="clearHighlightBtn" hidden>Auswahl löschen ✕</button>
      </div>

      <div class="grid-scroll" id="gridScroll">
      <div class="grid-frame" id="gridFrame">
        <div class="body-row">
          <div class="image-wrapper" id="imageWrapper">
            <img id="gridImg" alt="Bild mit Raster">
            <div class="grid-overlay" id="gridOverlay"></div>
            <div class="highlight-rect" id="highlightRect" hidden></div>
          </div>
        </div>
      </div>
      </div>

      <div class="result-box" id="resultBox" hidden>
        <div class="result-title" id="resultTitle"></div>
        <ol class="result-list" id="resultList"></ol>
      </div>
    </section>

    <section class="actions">
      <button class="btn-emerald" id="saveBtn" disabled>💾 Sichern</button>
      <button class="btn-outline-rose" id="deleteBtn">🗑️ Löschen</button>
      <span class="status-msg" id="statusMsg"></span>
    </section>
  </div>

<script>
(function () {
  const STORAGE_KEY = 'bild-raster-katalog-projekt';
  const MAX_DIM = 1400;
  const MAX_FIELDS = 20000;

  let imageSrc = null;
  let imgDims = { w: 0, h: 0 };
  let xCount = 40; // Zeilen
  let yCount = 50; // Spalten
  let generated = false;
  let pieceSrc = null;
  let pieceBusy = false; // Teil wird gerade freigestellt
  let searchRunning = false; // Abgleich läuft
  let lastTop = null; // zuletzt gefundene Felder (für das Neuzeichnen der Markierungen)
  const ZOOMS = [1, 1.5, 2, 3, 4];
  let zoomIdx = 0;
  let lastPose = null; // genaue Lage des Teils im Bild (Bruchteile der Bildgröße)

  const el = (id) => document.getElementById(id);
  const loadingScreen = el('loadingScreen');
  const mainApp = el('mainApp');
  const pickImageBtn = el('pickImageBtn');
  const fileInput = el('fileInput');
  const dimsLabel = el('dimsLabel');
  const previewImg = el('previewImg');
  const emptyBox = el('emptyBox');
  const pickPieceBtn = el('pickPieceBtn');
  const pieceInput = el('pieceInput');
  const piecePreview = el('piecePreview');
  const pieceEmptyBox = el('pieceEmptyBox');
  const xCountInput = el('xCount');
  const yCountInput = el('yCount');
  const totalCount = el('totalCount');
  const createGridBtn = el('createGridBtn');
  const searchBtn = el('searchBtn');
  const gridSection = el('gridSection');
  const imageWrapper = el('imageWrapper');
  const gridImg = el('gridImg');
  const gridOverlay = el('gridOverlay');
  const highlightRect = el('highlightRect');
  const cellInfo = el('cellInfo');
  const gridScroll = el('gridScroll');
  const gridFrame = el('gridFrame');
  const zoomOutBtn = el('zoomOutBtn');
  const zoomInBtn = el('zoomInBtn');
  const zoomLabel = el('zoomLabel');
  const resultBox = el('resultBox');
  const resultTitle = el('resultTitle');
  const resultList = el('resultList');
  const clearHighlightBtn = el('clearHighlightBtn');
  const saveBtn = el('saveBtn');
  const deleteBtn = el('deleteBtn');
  const statusMsg = el('statusMsg');

  function updateTotal() {
    totalCount.textContent = xCount * yCount;
  }

  function refreshImageUI() {
    if (imageSrc) {
      previewImg.src = imageSrc;
      previewImg.hidden = false;
      emptyBox.hidden = true;
      dimsLabel.hidden = false;
      dimsLabel.textContent = imgDims.w + ' × ' + imgDims.h + ' px';
      createGridBtn.disabled = false;
    } else {
      previewImg.hidden = true;
      emptyBox.hidden = false;
      dimsLabel.hidden = true;
      createGridBtn.disabled = true;
    }
  }

  function refreshPieceUI() {
    if (pieceSrc) {
      piecePreview.src = pieceSrc;
      piecePreview.hidden = false;
      pieceEmptyBox.hidden = true;
    } else {
      piecePreview.hidden = true;
      pieceEmptyBox.hidden = false;
    }
  }

  function clearHighlight() {
    highlightRect.hidden = true;
    cellInfo.textContent = '';
    clearHighlightBtn.hidden = true;
  }

  function updateSearchBtnState() {
    searchBtn.disabled = !(generated && pieceSrc) || pieceBusy || searchRunning;
  }

  function clearSearchMatches() {
    imageWrapper.querySelectorAll('.search-match, .piece-pose').forEach((n) => n.remove());
    lastTop = null;
    lastPose = null;
    resultList.innerHTML = '';
    resultBox.hidden = true;
  }

  // Mögliche Treffer werden gelb markiert (mit Rang); score 0..1
  function markCell(row, col, rank) {
    const div = document.createElement('div');
    div.className = 'search-match';
    div.style.left = (col / yCount * 100) + '%';
    div.style.top = (row / xCount * 100) + '%';
    div.style.width = (100 / yCount) + '%';
    div.style.height = (100 / xCount) + '%';
    if (imageWrapper.clientWidth / yCount >= 22 && imageWrapper.clientHeight / xCount >= 16) {
      const span = document.createElement('span');
      span.className = 'pct';
      span.textContent = rank;
      div.appendChild(span);
    }
    imageWrapper.appendChild(div);
  }

  // Liste der möglichen Treffer unter dem Raster, absteigend nach Übereinstimmung
  function showResultList(top, total) {
    resultList.innerHTML = '';
    top.forEach((r, i) => {
      const p = Math.round(r.score * 100);
      const li = document.createElement('li');
      li.className = 'result-item';
      li.title = 'Feld im Raster anzeigen';
      li.innerHTML = '<span class="result-rank">' + (i + 1) + '</span><img class="result-thumb" alt="' + r.name +
        '" src="' + r.img + '"><span class="result-name">' + r.name +
        '</span><span class="result-bar"><i style="width:' + p + '%"></i></span><span class="result-pct">' + p + ' %</span>';
      li.addEventListener('click', () => {
        showHighlight(r.row, r.col);
        highlightRect.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
      });
      resultList.appendChild(li);
    });
    resultTitle.textContent = 'Die ' + top.length + ' wahrscheinlichsten Felder (absteigend nach Übereinstimmung)';
    resultBox.hidden = false;
  }

  // Markierungen neu zeichnen (nötig, wenn sich die Größe des Bildes durch Zoom/Fenster ändert)
  function redrawMarks() {
    imageWrapper.querySelectorAll('.search-match, .piece-pose').forEach((n) => n.remove());
    if (lastTop) lastTop.forEach((r, i) => markCell(r.row, r.col, i + 1));
    if (lastPose) {
      const div = document.createElement('div');
      div.className = 'piece-pose';
      div.style.left = (lastPose.cx * 100) + '%';
      div.style.top = (lastPose.cy * 100) + '%';
      div.style.width = (lastPose.w * 100) + '%';
      div.style.height = (lastPose.h * 100) + '%';
      div.style.transform = 'translate(-50%, -50%) rotate(' + lastPose.angle + 'deg)';
      imageWrapper.appendChild(div);
    }
  }
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(redrawMarks).observe(imageWrapper);

  function setZoom(idx) {
    idx = Math.max(0, Math.min(ZOOMS.length - 1, idx));
    // Bildmitte beim Zoomen beibehalten
    const cx = (gridScroll.scrollLeft + gridScroll.clientWidth / 2) / gridScroll.scrollWidth;
    const cy = (gridScroll.scrollTop + gridScroll.clientHeight / 2) / gridScroll.scrollHeight;
    zoomIdx = idx;
    gridFrame.style.setProperty('--zoom', ZOOMS[idx]);
    zoomLabel.textContent = Math.round(ZOOMS[idx] * 100) + ' %';
    zoomOutBtn.disabled = idx === 0;
    zoomInBtn.disabled = idx === ZOOMS.length - 1;
    gridScroll.scrollLeft = cx * gridScroll.scrollWidth - gridScroll.clientWidth / 2;
    gridScroll.scrollTop = cy * gridScroll.scrollHeight - gridScroll.clientHeight / 2;
  }
  zoomOutBtn.addEventListener('click', () => setZoom(zoomIdx - 1));
  zoomInBtn.addEventListener('click', () => setZoom(zoomIdx + 1));
  setZoom(0);

  function showHighlight(row, col) {
    const leftPct = (col / yCount) * 100;
    const topPct = (row / xCount) * 100;
    const wPct = 100 / yCount;
    const hPct = 100 / xCount;
    highlightRect.style.left = leftPct + '%';
    highlightRect.style.top = topPct + '%';
    highlightRect.style.width = wPct + '%';
    highlightRect.style.height = hPct + '%';
    highlightRect.hidden = false;
    cellInfo.textContent = 'Ausgewählt: Z' + (row + 1) + ' / S' + (col + 1);
    clearHighlightBtn.hidden = false;
  }

  function drawGridOverlay() {
    gridOverlay.style.backgroundImage =
      'linear-gradient(to right, rgba(124,58,237,0.5) 1px, transparent 1px),' +
      'linear-gradient(to bottom, rgba(124,58,237,0.5) 1px, transparent 1px)';
    gridOverlay.style.backgroundSize = (100 / yCount) + '% 100%, 100% ' + (100 / xCount) + '%';
  }

  // Bild-Upload
  pickImageBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > MAX_DIM || h > MAX_DIM) {
          const scale = Math.min(MAX_DIM / w, MAX_DIM / h);
          w = Math.round(w * scale);
          h = Math.round(h * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        imageSrc = canvas.toDataURL('image/jpeg', 0.85);
        imgDims = { w, h };
        generated = false;
        statusMsg.textContent = '';
        saveBtn.disabled = true;
        gridSection.hidden = true;
        clearSearchMatches();
        updateSearchBtnState();
        refreshImageUI();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  });

  // Freistellen: Der Hintergrund wird von den Bildrändern aus per Flood-Fill entfernt (folgt auch
  // weichen Verläufen/Schatten). Übrig bleibt die größte zusammenhängende Fläche (Löcher gefüllt),
  // die Kante wird geglättet und als echte Transparenz (Alpha) ausgegeben.
  function removeBackground(srcEl) {
    const WORK = MAX_DIM; // volle (bereits verkleinerte) Auflösung, keine zusätzliche Verkleinerung
    const scale = Math.min(1, WORK / Math.max(srcEl.width, srcEl.height));
    const cw = Math.max(1, Math.round(srcEl.width * scale));
    const ch = Math.max(1, Math.round(srcEl.height * scale));
    const canvas = document.createElement('canvas');
    canvas.width = cw;
    canvas.height = ch;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(srcEl, 0, 0, cw, ch);
    const data = ctx.getImageData(0, 0, cw, ch).data;
    const N = cw * ch;
    const fail = { canvas, cropped: false };
    if (cw < 8 || ch < 8) return fail;

    // 1) Hintergrundfarbe = Median des Randstreifens (robust, auch wenn das Teil den Rand berührt)
    const border = Math.max(2, Math.round(Math.min(cw, ch) * 0.03));
    const eachBorder = (fn) => {
      for (let y = 0; y < ch; y++) {
        if (y < border || y >= ch - border) {
          for (let x = 0; x < cw; x++) fn(y * cw + x);
        } else {
          for (let x = 0; x < border; x++) fn(y * cw + x);
          for (let x = cw - border; x < cw; x++) fn(y * cw + x);
        }
      }
    };
    const hist = [new Uint32Array(256), new Uint32Array(256), new Uint32Array(256)];
    let cnt = 0;
    eachBorder((i) => {
      const p = i * 4;
      hist[0][data[p]]++; hist[1][data[p + 1]]++; hist[2][data[p + 2]]++;
      cnt++;
    });
    const median = (h) => {
      let acc = 0;
      for (let v = 0; v < 256; v++) { acc += h[v]; if (acc * 2 >= cnt) return v; }
      return 255;
    };
    const bgR = median(hist[0]), bgG = median(hist[1]), bgB = median(hist[2]);

    // 2) Farbabstand jedes Pixels zum Hintergrund; Toleranz passt sich der Streuung am Rand an
    const dist = new Float32Array(N);
    for (let i = 0, p = 0; i < N; i++, p += 4) {
      const dr = data[p] - bgR, dg = data[p + 1] - bgG, db = data[p + 2] - bgB;
      dist[i] = Math.sqrt(dr * dr + dg * dg + db * db);
    }
    let dsum = 0, dn = 0;
    eachBorder((i) => { if (dist[i] < 60) { dsum += dist[i]; dn++; } });
    const sigma = dn ? dsum / dn : 0;
    const tLow = Math.min(48, Math.max(18, sigma * 2 + 12)); // sicher Hintergrund
    const tMid = tLow * 2.2; // Hintergrund nur, wenn der Übergang zum Nachbarpixel weich ist
    const STEP2 = 7 * 7;
    // Schatten: ähnliche Farbtönung wie der Hintergrund, nur dunkler; Übergänge zum Nachbarpixel
    // sind weich (Schattenverlauf), am Teilrand dagegen hart – dort stoppt die Ausbreitung
    const bgLen = Math.sqrt(bgR * bgR + bgG * bgG + bgB * bgB) || 1;
    const bgUR = bgR / bgLen, bgUG = bgG / bgLen, bgUB = bgB / bgLen;
    const SHADOW_STEP2 = 22 * 22;

    // 3) Flood-Fill vom Bildrand: nur mit dem Rand verbundener Hintergrund wird entfernt
    const isBg = new Uint8Array(N);
    const queue = new Int32Array(N);
    const runFlood = (useShadow) => {
      isBg.fill(0);
      let qh = 0, qt = 0;
      const seed = (i) => { if (!isBg[i] && dist[i] <= tLow) { isBg[i] = 1; queue[qt++] = i; } };
      for (let x = 0; x < cw; x++) { seed(x); seed((ch - 1) * cw + x); }
      for (let y = 0; y < ch; y++) { seed(y * cw); seed(y * cw + cw - 1); }
      const grow = (ni, p) => {
        if (isBg[ni]) return;
        const d = dist[ni];
        let ok = d <= tLow;
        if (!ok) {
          const q = ni * 4;
          const a = data[q] - data[p], b = data[q + 1] - data[p + 1], c = data[q + 2] - data[p + 2];
          const step2 = a * a + b * b + c * c;
          if (d <= tMid && step2 <= STEP2) {
            ok = true; // weicher Verlauf
          } else if (useShadow && step2 <= SHADOW_STEP2) {
            const r = data[q], g = data[q + 1], bl = data[q + 2];
            const len = Math.sqrt(r * r + g * g + bl * bl) || 1;
            const pr = data[p], pg = data[p + 1], pb = data[p + 2];
            const plen = Math.sqrt(pr * pr + pg * pg + pb * pb) || 1;
            const ratio = len / bgLen;
            // Schatten werden zum Kern hin nur dunkler; ein hellerer Nachbar ist schon das Teil
            if (ratio >= 0.18 && ratio <= 1.1 && len <= plen + 8) {
              const noise = 4 / len; // Farbtonrauschen wächst bei dunklen Pixeln
              const hr = r / len - bgUR, hg = g / len - bgUG, hb = bl / len - bgUB;
              const hueG = 0.12 + noise;
              if (hr * hr + hg * hg + hb * hb <= hueG * hueG) {
                const nr = r / len - pr / plen, ng = g / len - pg / plen, nb = bl / len - pb / plen;
                const hueN = 0.03 + 4 / Math.min(len, plen);
                ok = nr * nr + ng * ng + nb * nb <= hueN * hueN; // Schatten (Farbton bleibt, nur dunkler)
              }
            }
          }
        }
        if (ok) { isBg[ni] = 1; queue[qt++] = ni; }
      };
      let qr = 0;
      while (qr < qt) {
        const i = queue[qr++];
        const x = i % cw;
        const p = i * 4;
        if (x > 0) grow(i - 1, p);
        if (x < cw - 1) grow(i + 1, p);
        if (i >= cw) grow(i - cw, p);
        if (i < N - cw) grow(i + cw, p);
      }
      let fg = 0;
      for (let i = 0; i < N; i++) if (!isBg[i]) fg++;
      return fg;
    };
    // erst ohne Schattenregel (sicher), dann mit; frisst die Schattenregel zu viel, gilt das sichere Ergebnis
    const fgBase = runFlood(false);
    if (fgBase < N * 0.02 || fgBase > N * 0.98) return fail; // kein klarer Hintergrund erkannt
    const baseBg = isBg.slice();
    const fgShadow = runFlood(true);
    if (fgShadow < fgBase * 0.75 || fgShadow < N * 0.02) isBg.set(baseBg);

    // 4) Nur die größte zusammenhängende Vordergrundfläche behalten (entfernt Flecken/Rauschen);
    //    eingeschlossene Bereiche bleiben dadurch automatisch gefüllt
    const flood = (start, visited) => {
      let h = 0, t = 0;
      queue[t++] = start; visited[start] = 1;
      while (h < t) {
        const i = queue[h++];
        const x = i % cw;
        if (x > 0 && !isBg[i - 1] && !visited[i - 1]) { visited[i - 1] = 1; queue[t++] = i - 1; }
        if (x < cw - 1 && !isBg[i + 1] && !visited[i + 1]) { visited[i + 1] = 1; queue[t++] = i + 1; }
        if (i >= cw && !isBg[i - cw] && !visited[i - cw]) { visited[i - cw] = 1; queue[t++] = i - cw; }
        if (i < N - cw && !isBg[i + cw] && !visited[i + cw]) { visited[i + cw] = 1; queue[t++] = i + cw; }
      }
      return t;
    };
    const seen = new Uint8Array(N);
    let bestSeed = -1, bestSize = 0;
    for (let i = 0; i < N; i++) {
      if (!isBg[i] && !seen[i]) {
        const size = flood(i, seen);
        if (size > bestSize) { bestSize = size; bestSeed = i; }
      }
    }
    if (bestSeed < 0 || bestSize < N * 0.01) return fail;
    const keep = new Uint8Array(N);
    flood(bestSeed, keep);

    // 5) Kante glätten (Box-Blur auf der Maske) und als weiche Alpha-Kante ausgeben
    const r = Math.max(1, Math.round(Math.min(cw, ch) * 0.002));
    const win = 2 * r + 1;
    const m0 = new Float32Array(N);
    for (let i = 0; i < N; i++) m0[i] = keep[i];
    const m1 = new Float32Array(N);
    for (let y = 0; y < ch; y++) {
      const row = y * cw;
      let acc = 0;
      for (let k = -r; k <= r; k++) acc += m0[row + Math.min(cw - 1, Math.max(0, k))];
      for (let x = 0; x < cw; x++) {
        m1[row + x] = acc / win;
        acc += m0[row + Math.min(cw - 1, x + r + 1)] - m0[row + Math.max(0, x - r)];
      }
    }
    // vertikaler Durchgang zeilenweise (cache-freundlich): ein Akkumulator pro Spalte
    const colAcc = new Float32Array(cw);
    for (let k = -r; k <= r; k++) {
      const row = Math.min(ch - 1, Math.max(0, k)) * cw;
      for (let x = 0; x < cw; x++) colAcc[x] += m1[row + x];
    }
    for (let y = 0; y < ch; y++) {
      const row = y * cw;
      for (let x = 0; x < cw; x++) m0[row + x] = colAcc[x] / win;
      const addRow = Math.min(ch - 1, y + r + 1) * cw, subRow = Math.max(0, y - r) * cw;
      for (let x = 0; x < cw; x++) colAcc[x] += m1[addRow + x] - m1[subRow + x];
    }
    const alpha = new Uint8Array(N);
    let minX = cw, minY = ch, maxX = -1, maxY = -1;
    for (let y = 0; y < ch; y++) {
      for (let x = 0; x < cw; x++) {
        const i = y * cw + x;
        const v = m0[i];
        let a;
        if (v <= 0.35) {
          a = 0;
        } else if (v >= 0.85) {
          a = 255;
        } else {
          const t = (v - 0.35) / 0.5; // Kante leicht nach innen, damit kein Hintergrundsaum bleibt
          a = Math.round(t * t * (3 - 2 * t) * 255);
        }
        alpha[i] = a;
        if (a > 10) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX < minX) return fail;

    // 6) Auf das Teil zuschneiden; Originalfarben bleiben erhalten, nur Alpha wird gesetzt
    const pad = 2;
    const bx0 = Math.max(0, minX - pad), by0 = Math.max(0, minY - pad);
    const bx1 = Math.min(cw - 1, maxX + pad), by1 = Math.min(ch - 1, maxY + pad);
    const cropW = bx1 - bx0 + 1, cropH = by1 - by0 + 1;
    const cropCanvas = document.createElement('canvas');
    cropCanvas.width = cropW;
    cropCanvas.height = cropH;
    const cctx = cropCanvas.getContext('2d');
    const out = cctx.createImageData(cropW, cropH);
    const od = out.data;
    for (let y = 0; y < cropH; y++) {
      for (let x = 0; x < cropW; x++) {
        const si = (by0 + y) * cw + (bx0 + x);
        const sp = si * 4, op = (y * cropW + x) * 4;
        od[op] = data[sp]; od[op + 1] = data[sp + 1]; od[op + 2] = data[sp + 2]; od[op + 3] = alpha[si];
      }
    }
    cctx.putImageData(out, 0, 0);
    return { canvas: cropCanvas, cropped: true };
  }

  // Teil-Upload: wird beim Laden freigestellt (Hintergrund entfernt), keine Suche
  pickPieceBtn.addEventListener('click', () => pieceInput.click());
  function handlePieceFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      // Sofort anzeigen, damit das Teil auch sichtbar ist, falls die Verarbeitung unten fehlschlägt.
      pieceSrc = ev.target.result;
      pieceBusy = true;
      refreshPieceUI();
      clearSearchMatches();
      updateSearchBtnState();
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > MAX_DIM || h > MAX_DIM) {
          const scale = Math.min(MAX_DIM / w, MAX_DIM / h);
          w = Math.round(w * scale);
          h = Math.round(h * scale);
        }
        try {
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          let result = null;
          try {
            result = removeBackground(canvas);
          } catch (bgErr) {
            result = null;
          }

          pieceSrc = (result && result.cropped)
            ? result.canvas.toDataURL('image/png')
            : canvas.toDataURL('image/jpeg', 0.85);
          refreshPieceUI();
        } catch (err) {
          // Rohbild bleibt sichtbar, nur die Verarbeitung ist fehlgeschlagen.
        }
        pieceBusy = false;
        updateSearchBtnState();
      };
      img.onerror = () => {
        pieceBusy = false;
        updateSearchBtnState();
        statusMsg.textContent = 'Teil-Bild konnte nicht gelesen werden.';
        setTimeout(() => { statusMsg.textContent = ''; }, 3000);
      };
      img.src = ev.target.result;
    };
    reader.onerror = () => {
      pieceBusy = false;
      updateSearchBtnState();
      statusMsg.textContent = 'Datei konnte nicht gelesen werden.';
      setTimeout(() => { statusMsg.textContent = ''; }, 3000);
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  }
  pieceInput.addEventListener('change', handlePieceFile);

  xCountInput.addEventListener('input', () => {
    xCount = Math.max(1, parseInt(xCountInput.value) || 1);
    updateTotal();
  });
  yCountInput.addEventListener('input', () => {
    yCount = Math.max(1, parseInt(yCountInput.value) || 1);
    updateTotal();
  });

  createGridBtn.addEventListener('click', () => {
    if (!imageSrc || xCount < 1 || yCount < 1) return;
    if (xCount * yCount > MAX_FIELDS) {
      alert('Bitte höchstens ' + MAX_FIELDS + ' Felder wählen (X × Y).');
      return;
    }
    generated = true;
    gridImg.src = imageSrc;
    drawGridOverlay();
    clearHighlight();
    clearSearchMatches();
    updateSearchBtnState();
    gridSection.hidden = false;
    saveBtn.disabled = false;
    statusMsg.textContent = '';
  });

  // ---- Abgleich: Teil im ganzen Bild suchen (maskierte normierte Korrelation, Maßstab + beliebige Drehung) ----
  // Das Teil (mit Transparenz als Maske) wird in drei Stufen (grob → mittel → fein) über das Bild geschoben.
  // Verglichen wird die Helligkeitsstruktur (ZNCC, unempfindlich gegen Helligkeit/Kontrast), am Ende zusätzlich
  // je Farbkanal. Das Ergebnis ist die genaue Lage (Position, Drehung) und das Rasterfeld darunter.
  const TOP_N = 3; // so viele Rasterfelder werden als mögliche Treffer angezeigt
  const COARSE_BODY = 10, MID_BODY = 20, FINE_BODY = 40; // Größe des Teilkörpers (px) je Stufe
  const COARSE_STEP = 6; // Winkelschritt der groben Suche (°)
  const COARSE_SCALES = [0.82, 1, 1.22]; // Maßstäbe relativ zur Schätzung (Teilkörper ≈ ein Rasterfeld)
  const COARSE_STRIDE = 2; // Positionsraster der groben Suche
  const DETAIL_STD = 20; // Teil gilt als zu einfarbig, wenn der Farbunterschied im Teil (siehe pieceDetail) unter diesem Wert liegt
  const PEAKS = 40; // so viele Kandidaten werden verfeinert
  const MIN_STD = 3; // Helligkeitsstreuung, unter der Teil/Bildausschnitt als einfarbig gilt

  const tileName = (row, col) => 'Z' + (row + 1) + ' / S' + (col + 1);

  // Teilkörper ohne Zapfen: Spalten/Zeilen mit deutlich weniger deckenden Pixeln als der Rest sind Zapfen
  function bodyBox(el) {
    const S = 64;
    const cv = document.createElement('canvas');
    cv.width = S;
    cv.height = S;
    const cx = cv.getContext('2d', { willReadFrequently: true });
    cx.drawImage(el, 0, 0, S, S);
    const d = cx.getImageData(0, 0, S, S).data;
    const col = new Int32Array(S), row = new Int32Array(S);
    let opaque = 0;
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      if (d[(y * S + x) * 4 + 3] >= 128) { col[x]++; row[y]++; opaque++; }
    }
    if (opaque > S * S * 0.97) return null; // kein Freisteller (keine Transparenz)
    let maxC = 0, maxR = 0;
    for (let i = 0; i < S; i++) { if (col[i] > maxC) maxC = col[i]; if (row[i] > maxR) maxR = row[i]; }
    let x0 = 0, x1 = S - 1, y0 = 0, y1 = S - 1;
    while (x0 < S - 1 && col[x0] < maxC * 0.6) x0++;
    while (x1 > x0 && col[x1] < maxC * 0.6) x1--;
    while (y0 < S - 1 && row[y0] < maxR * 0.6) y0++;
    while (y1 > y0 && row[y1] < maxR * 0.6) y1--;
    if (x1 - x0 < S * 0.3 || y1 - y0 < S * 0.3) return null;
    return { x: x0 / S * el.width, y: y0 / S * el.height, w: (x1 - x0 + 1) / S * el.width, h: (y1 - y0 + 1) / S * el.height };
  }

  // Farbunterschied im freigestellten Teil: robuste Streuung (Abstand zwischen dem 10. und 90. Perzentil, auf Standardabweichung
  // umgerechnet) je Farbkanal im Teilinneren, größter Kanal zählt. Randpixel (Kante, Schatten, Hintergrundreste) sind ausgespart,
  // einzelne Ausreißer (Glanzpunkte) zählen kaum. Klein = einfarbige Fläche, die sich nicht zuverlässig im Bild finden lässt.
  function pieceDetail(el) {
    const k = 96 / Math.max(el.width, el.height);
    const W = Math.max(8, Math.round(el.width * k)), H = Math.max(8, Math.round(el.height * k));
    const cv = document.createElement('canvas');
    cv.width = W;
    cv.height = H;
    const cx = cv.getContext('2d', { willReadFrequently: true });
    cx.drawImage(el, 0, 0, W, H);
    const d = cx.getImageData(0, 0, W, H).data;
    const R = 4;
    const solid = (x, y) => x >= 0 && y >= 0 && x < W && y < H && d[(y * W + x) * 4 + 3] >= 250;
    const inner = (x, y) => solid(x, y) && solid(x - R, y) && solid(x + R, y) && solid(x, y - R) && solid(x, y + R);
    const hist = [new Uint32Array(256), new Uint32Array(256), new Uint32Array(256)];
    let n = 0;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        if (!inner(x, y)) continue;
        const i = (y * W + x) * 4;
        n++;
        for (let c = 0; c < 3; c++) hist[c][d[i + c]]++;
      }
    }
    if (n < 30) return { std: 0, n };
    const pct = (h, p) => { let acc = 0; const t = p * n; for (let v = 0; v < 256; v++) { acc += h[v]; if (acc >= t) return v; } return 255; };
    let std = 0;
    for (let c = 0; c < 3; c++) std = Math.max(std, (pct(hist[c], 0.9) - pct(hist[c], 0.1)) / 2.563);
    return { std, n };
  }

  const yieldUI = () => new Promise((r) => setTimeout(r, 0));

  // Bild als Farbebenen (R, G, B) mit Faktor f verkleinert und mit Randfortsetzung (pad)
  function makePlanes(imgEl, f, pad) {
    const w = Math.max(1, Math.round(imgEl.width / f)), h = Math.max(1, Math.round(imgEl.height / f));
    const Wp = w + 2 * pad, Hp = h + 2 * pad;
    const cv = document.createElement('canvas');
    cv.width = Wp;
    cv.height = Hp;
    const cx = cv.getContext('2d', { willReadFrequently: true });
    cx.imageSmoothingEnabled = true;
    cx.imageSmoothingQuality = 'high';
    cx.drawImage(imgEl, 0, 0, imgEl.width, imgEl.height, pad, pad, w, h);
    if (pad > 0) {
      cx.drawImage(cv, pad, pad, 1, h, 0, pad, pad, h);
      cx.drawImage(cv, pad + w - 1, pad, 1, h, pad + w, pad, pad, h);
      cx.drawImage(cv, 0, pad, Wp, 1, 0, 0, Wp, pad);
      cx.drawImage(cv, 0, pad + h - 1, Wp, 1, 0, pad + h, Wp, pad);
    }
    const d = cx.getImageData(0, 0, Wp, Hp).data;
    const n = Wp * Hp;
    const R = new Float32Array(n), G = new Float32Array(n), B = new Float32Array(n);
    for (let i = 0, p = 0; i < n; i++, p += 4) { R[i] = d[p]; G[i] = d[p + 1]; B[i] = d[p + 2]; }
    return { w, h, Wp, Hp, pad, f, P: [R, G, B] };
  }

  // Vorlage: das Teil mit Maßstab scale (Bildpixel je Teilpixel) und Drehung angle (°), bei Auflösungsfaktor f.
  // Nur deckende Pixel zählen (Maske); je Farbkanal mittelwertfrei, damit die Korrelation ein Skalarprodukt ist.
  function makeTemplate(pieceEl, scale, angle, f, erode) {
    const pw = pieceEl.width, ph = pieceEl.height;
    const k = scale / f;
    const D = Math.ceil(Math.hypot(pw, ph) * k) + 4;
    const cv = document.createElement('canvas');
    cv.width = D;
    cv.height = D;
    const cx = cv.getContext('2d', { willReadFrequently: true });
    cx.imageSmoothingEnabled = true;
    cx.imageSmoothingQuality = 'high';
    cx.translate(D / 2, D / 2);
    cx.rotate(angle * Math.PI / 180);
    cx.scale(k, k);
    cx.drawImage(pieceEl, -pw / 2, -ph / 2);
    const d = cx.getImageData(0, 0, D, D).data;
    const solid = new Uint8Array(D * D);
    for (let i = 0; i < D * D; i++) solid[i] = d[i * 4 + 3] >= 250 ? 1 : 0;
    const idx = [];
    for (let y = 0; y < D; y++) {
      for (let x = 0; x < D; x++) {
        const i = y * D + x;
        if (!solid[i]) continue;
        if (erode && (x === 0 || y === 0 || x === D - 1 || y === D - 1 || !solid[i - 1] || !solid[i + 1] || !solid[i - D] || !solid[i + D])) continue;
        idx.push(i);
      }
    }
    const n = idx.length;
    if (n < 12) return null;
    const c0 = D >> 1;
    const dx = new Int16Array(n), dy = new Int16Array(n);
    const v = [new Float32Array(n), new Float32Array(n), new Float32Array(n)];
    const sum = [0, 0, 0];
    for (let m = 0; m < n; m++) {
      const i = idx[m];
      dx[m] = (i % D) - c0;
      dy[m] = ((i / D) | 0) - c0;
      for (let c = 0; c < 3; c++) { v[c][m] = d[i * 4 + c]; sum[c] += v[c][m]; }
    }
    const norm = [0, 0, 0];
    let maxStd = 0;
    for (let c = 0; c < 3; c++) {
      const mean = sum[c] / n;
      let q = 0;
      for (let m = 0; m < n; m++) { v[c][m] -= mean; q += v[c][m] * v[c][m]; }
      norm[c] = q;
      maxStd = Math.max(maxStd, Math.sqrt(q / n));
    }
    if (maxStd < MIN_STD) return null; // Teil zu einfarbig für einen Strukturvergleich
    return { n, dx, dy, v, norm, off: null, offW: -1 };
  }

  function bindOffsets(t, Wp) {
    if (t.offW === Wp) return;
    t.off = new Int32Array(t.n);
    for (let i = 0; i < t.n; i++) t.off[i] = t.dy[i] * Wp + t.dx[i];
    t.offW = Wp;
  }

  // Korrelation (ZNCC) der Vorlage mit dem Bildausschnitt um Ebenenindex p: Mittel über die Farbkanäle mit Struktur
  function znccAt(P, t, p) {
    const off = t.off, n = t.n;
    let sum = 0, cnt = 0;
    for (let c = 0; c < 3; c++) {
      if (t.norm[c] < n * 2.25) continue; // Kanal ohne Struktur (Streuung < 1,5)
      const I = P[c], tv = t.v[c];
      let sI = 0, sII = 0, sIT = 0;
      for (let k = 0; k < n; k++) {
        const x = I[p + off[k]];
        sI += x; sII += x * x; sIT += tv[k] * x;
      }
      const varI = sII - sI * sI / n;
      sum += varI < n * 2.25 ? 0 : sIT / Math.sqrt(varI * t.norm[c]);
      cnt++;
    }
    return cnt ? sum / cnt : 0;
  }

  // Eine Verfeinerungsstufe: um die Lage (x, y in Bildpixeln, Drehung a, Maßstab s) in kleinen Schritten suchen
  function refinePose(pieceEl, pl, pose, angles, scales, radius, erode) {
    const f = pl.f, Wp = pl.Wp;
    const cx = Math.round(pose.x / f + pl.pad - 0.5), cy = Math.round(pose.y / f + pl.pad - 0.5);
    let best = null;
    for (const da of angles) {
      for (const ds of scales) {
        const a = pose.a + da, s = pose.s * ds;
        const t = makeTemplate(pieceEl, s, a, f, erode);
        if (!t) continue;
        bindOffsets(t, Wp);
        for (let yy = Math.max(pl.pad, cy - radius); yy <= Math.min(pl.pad + pl.h - 1, cy + radius); yy++) {
          for (let xx = Math.max(pl.pad, cx - radius); xx <= Math.min(pl.pad + pl.w - 1, cx + radius); xx++) {
            const sc = znccAt(pl.P, t, yy * Wp + xx);
            if (!best || sc > best.score) best = { score: sc, x: (xx - pl.pad + 0.5) * f, y: (yy - pl.pad + 0.5) * f, a, s, t, p: yy * Wp + xx };
          }
        }
      }
    }
    return best;
  }

  // Teil im Bild suchen. Ergebnis: { cells: [{name,row,col,score,x,y,angle}], pose: {x,y,angle,w,h} } (Bildpixel)
  async function locateCore(pieceEl, imgEl, rows, cols, onProgress) {
    const cellW = imgEl.width / cols, cellH = imgEl.height / rows, cellMin = Math.min(cellW, cellH);
    const pw = pieceEl.width, ph = pieceEl.height;
    const body = bodyBox(pieceEl) || { x: 0, y: 0, w: pw, h: ph };
    // Annahme: der Teilkörper (ohne Zapfen) entspricht etwa einem Rasterfeld
    const s0 = Math.sqrt((cellW / body.w) * (cellH / body.h));
    const bodyOff = { x: body.x + body.w / 2 - pw / 2, y: body.y + body.h / 2 - ph / 2 }; // Körpermitte relativ zur Teilmitte
    const half = 0.5 * Math.hypot(pw, ph) * s0 * 1.4; // größte Halbdiagonale in Bildpixeln
    const fC = Math.max(1, cellMin / COARSE_BODY), fM = Math.max(1, cellMin / MID_BODY), fF = Math.max(1, cellMin / FINE_BODY);
    const pad = (f) => Math.ceil(half / f) + 3;

    // --- Stufe 1: grob, alle Positionen, Maßstäbe und Drehungen ---
    const plC = makePlanes(imgEl, fC, pad(fC));
    const mw = Math.ceil(plC.w / COARSE_STRIDE), mh = Math.ceil(plC.h / COARSE_STRIDE);
    const bestSc = new Float32Array(mw * mh).fill(-1), bestA = new Float32Array(mw * mh), bestS = new Float32Array(mw * mh);
    const nAng = Math.ceil(360 / COARSE_STEP), total = nAng * COARSE_SCALES.length;
    let done = 0;
    for (const sf of COARSE_SCALES) {
      for (let ai = 0; ai < nAng; ai++, done++) {
        const a = ai * COARSE_STEP;
        const t = makeTemplate(pieceEl, s0 * sf, a, fC, false);
        if (t) {
          bindOffsets(t, plC.Wp);
          for (let my = 0; my < mh; my++) {
            const row = (plC.pad + my * COARSE_STRIDE) * plC.Wp + plC.pad;
            for (let mx = 0; mx < mw; mx++) {
              const sc = znccAt(plC.P, t, row + mx * COARSE_STRIDE);
              const i = my * mw + mx;
              if (sc > bestSc[i]) { bestSc[i] = sc; bestA[i] = a; bestS[i] = s0 * sf; }
            }
          }
        }
        if (ai % 6 === 5) { if (onProgress) onProgress(done / total * 0.8); await yieldUI(); }
      }
    }
    // Kandidaten: beste Positionen, nicht zu nah beieinander
    const order = Array.from(bestSc.keys()).filter((i) => bestSc[i] > 0).sort((p, q) => bestSc[q] - bestSc[p]);
    const minDist = Math.max(2, 0.6 * cellMin / (fC * COARSE_STRIDE));
    const cand = [];
    for (const i of order) {
      const mx = i % mw, my = (i / mw) | 0;
      if (cand.every((c) => Math.hypot(c.mx - mx, c.my - my) >= minDist)) {
        cand.push({ mx, my, x: (mx * COARSE_STRIDE + 0.5) * fC, y: (my * COARSE_STRIDE + 0.5) * fC, a: bestA[i], s: bestS[i] });
        if (cand.length >= PEAKS) break;
      }
    }

    // --- Stufe 2 und 3: mittel und fein verfeinern ---
    const plM = makePlanes(imgEl, fM, pad(fM));
    const plF = makePlanes(imgEl, fF, pad(fF));
    const rM = Math.ceil(fC * (COARSE_STRIDE / 2 + 1) / fM), rF = Math.ceil(fM * 1.5 / fF) + 1;
    const found = [];
    for (let ci = 0; ci < cand.length; ci++) {
      const c = cand[ci];
      const m = refinePose(pieceEl, plM, c, [-6, -3, 0, 3, 6], [0.93, 1, 1.07], rM, false);
      if (m) {
        const f = refinePose(pieceEl, plF, { x: m.x, y: m.y, a: m.a, s: m.s }, [-2, -1, 0, 1, 2], [0.97, 1, 1.03], rF, true);
        if (f) {
          found.push({ x: f.x, y: f.y, a: f.a, s: f.s, score: Math.max(0, Math.min(1, f.score)) });
        }
      }
      if (ci % 5 === 4) { if (onProgress) onProgress(0.8 + 0.2 * ci / cand.length); await yieldUI(); }
    }
    found.sort((p, q) => q.score - p.score);

    // Rasterfeld je Fund: unter der Körpermitte des Teils; je Feld zählt der beste Fund
    const cells = new Map();
    for (const r of found) {
      const rad = r.a * Math.PI / 180, ox = bodyOff.x * r.s, oy = bodyOff.y * r.s;
      const bx = r.x + ox * Math.cos(rad) - oy * Math.sin(rad), by = r.y + ox * Math.sin(rad) + oy * Math.cos(rad);
      const col = Math.max(0, Math.min(cols - 1, Math.floor(bx / cellW))), row = Math.max(0, Math.min(rows - 1, Math.floor(by / cellH)));
      const name = tileName(row, col);
      if (!cells.has(name)) cells.set(name, { name, row, col, score: r.score, x: r.x, y: r.y, angle: r.a });
    }
    const best = found[0];
    return {
      cells: Array.from(cells.values()).slice(0, TOP_N),
      pose: best ? { x: best.x, y: best.y, angle: best.a, w: pw * best.s, h: ph * best.s } : null,
    };
  }

  // Einstieg: erst den Farbunterschied prüfen (zu einfarbige Teile lassen sich nicht finden), dann suchen.
  async function locatePiece(pieceEl, imgEl, rows, cols, onProgress) {
    const det = pieceDetail(pieceEl);
    if (det.std < DETAIL_STD) {
      return {
        cells: [], pose: null, detail: det.std,
        error: 'Keine Suche möglich: Das Teil hat zu wenig Farbunterschied (fast einfarbig; gemessen ' + Math.round(det.std) + ', nötig mindestens ' + DETAIL_STD + '). Bitte ein anderes Teil wählen oder das Foto besser ausleuchten.',
      };
    }
    const res = await locateCore(pieceEl, imgEl, rows, cols, onProgress);
    return { ...res, detail: det.std };
  }
  // ---- Ende Abgleich ----

  const loadImage = (src) => new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = reject;
    im.src = src;
  });
  // Bild eines Container-Elements (das ausgeschnittene Stück) als kleine Vorschau
  function tileThumb(gridEl, row, col, rows, cols) {
    const cellW = gridEl.width / cols, cellH = gridEl.height / rows;
    const k = 96 / Math.max(cellW, cellH);
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(cellW * k));
    cv.height = Math.max(1, Math.round(cellH * k));
    cv.getContext('2d').drawImage(gridEl, col * cellW, row * cellH, cellW, cellH, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', 0.85);
  }
  const gridKey = () => xCount + 'x' + yCount + ':' + (imageSrc ? imageSrc.length + ':' + imageSrc.slice(-64) : '');

  // Das Teil wird im ganzen Bild gesucht (nicht nur auf Rasterfeldern): maskierte Korrelation über Maßstab und
  // beliebige Drehung, grob → fein. Ergebnis ist die genaue Lage (orange gestrichelt) und die TOP_N Rasterfelder
  // darunter (benannt nach den Koordinaten, z. B. "Z3 / S5"), absteigend nach Übereinstimmung.
  async function handleSearch() {
    if (searchRunning || !generated || !imageSrc) return;
    if (!pieceSrc) {
      statusMsg.textContent = 'Bitte zuerst ein Teil wählen.';
      setTimeout(() => { statusMsg.textContent = ''; }, 3000);
      return;
    }
    searchRunning = true;
    clearSearchMatches();
    clearHighlight();
    updateSearchBtnState();
    const key = gridKey(), pieceKey = pieceSrc;
    const rows = xCount, cols = yCount;
    try {
      cellInfo.classList.remove('err-msg');
      cellInfo.textContent = 'Suche läuft… 0 %';
      const [pieceEl, gridEl] = await Promise.all([loadImage(pieceSrc), loadImage(imageSrc)]);
      const res = await locatePiece(pieceEl, gridEl, rows, cols, (p) => {
        cellInfo.textContent = 'Suche läuft… ' + Math.round(p * 100) + ' %';
      });
      if (key !== gridKey() || pieceKey !== pieceSrc) { cellInfo.textContent = ''; return; } // währenddessen geändert
      if (res.error) {
        cellInfo.textContent = res.error;
        cellInfo.classList.add('err-msg');
        return;
      }
      if (!res.cells.length) {
        cellInfo.textContent = 'Das Teil konnte im Bild nicht gefunden werden (zu einfarbig?).';
        cellInfo.classList.add('err-msg');
        return;
      }
      const top = res.cells;
      top.forEach((r) => { r.img = tileThumb(gridEl, r.row, r.col, rows, cols); });
      const P = res.pose;
      lastTop = top;
      lastPose = { cx: P.x / gridEl.width, cy: P.y / gridEl.height, w: P.w / gridEl.width, h: P.h / gridEl.height, angle: P.angle };
      redrawMarks();
      showResultList(top, rows * cols);
      // nach der Suche: 400 % Vergrößerung, die gefundene Lage in der Mitte des Ausschnitts
      setZoom(ZOOMS.indexOf(4));
      const poseEl = imageWrapper.querySelector('.piece-pose');
      if (poseEl) {
        const pr = poseEl.getBoundingClientRect(), sr = gridScroll.getBoundingClientRect();
        gridScroll.scrollLeft += pr.left + pr.width / 2 - (sr.left + sr.width / 2);
        gridScroll.scrollTop += pr.top + pr.height / 2 - (sr.top + sr.height / 2);
      }
      cellInfo.textContent = 'Bestes Feld: ' + top[0].name + ' (' + Math.round(top[0].score * 100) + ' %) · Drehung ' +
        Math.round(((P.angle % 360) + 360) % 360) + '°' + ' · Farbunterschied ' + Math.round(res.detail);
    } catch (err) {
      cellInfo.textContent = 'Suche fehlgeschlagen.';
    } finally {
      searchRunning = false;
      updateSearchBtnState();
    }
  }
  searchBtn.addEventListener('click', handleSearch);

  imageWrapper.addEventListener('click', (e) => {
    const rect = imageWrapper.getBoundingClientRect();
    const relX = (e.clientX - rect.left) / rect.width;
    const relY = (e.clientY - rect.top) / rect.height;
    const col = Math.min(yCount - 1, Math.max(0, Math.floor(relX * yCount)));
    const row = Math.min(xCount - 1, Math.max(0, Math.floor(relY * xCount)));
    showHighlight(row, col);
  });

  clearHighlightBtn.addEventListener('click', clearHighlight);

  async function handleSave() {
    saveBtn.disabled = true;
    statusMsg.textContent = '';
    try {
      const payload = JSON.stringify({ imageSrc, imgDims, xCount, yCount, pieceSrc });
      const result = await window.storage.set(STORAGE_KEY, payload, false);
      statusMsg.textContent = result ? 'Gesichert.' : 'Sichern fehlgeschlagen.';
    } catch (e) {
      statusMsg.textContent = 'Sichern fehlgeschlagen.';
    } finally {
      saveBtn.disabled = false;
      setTimeout(() => { statusMsg.textContent = ''; }, 3000);
    }
  }
  saveBtn.addEventListener('click', handleSave);

  async function handleDelete() {
    const ok = window.confirm('Wirklich alles löschen? Bild und Raster werden entfernt. Das kann nicht rückgängig gemacht werden.');
    if (!ok) return;
    try {
      await window.storage.delete(STORAGE_KEY, false);
    } catch (e) {}
    imageSrc = null;
    imgDims = { w: 0, h: 0 };
    xCount = 40;
    yCount = 50;
    generated = false;
    pieceSrc = null;
    pieceBusy = false;
    xCountInput.value = 40;
    yCountInput.value = 50;
    saveBtn.disabled = true;
    clearHighlight();
    clearSearchMatches();
    gridSection.hidden = true;
    updateTotal();
    refreshImageUI();
    refreshPieceUI();
    updateSearchBtnState();
    statusMsg.textContent = 'Gelöscht.';
    setTimeout(() => { statusMsg.textContent = ''; }, 3000);
  }
  deleteBtn.addEventListener('click', handleDelete);

  // Gespeichertes Projekt laden
  (async function init() {
    try {
      const result = await window.storage.get(STORAGE_KEY, false);
      if (result && result.value) {
        const data = JSON.parse(result.value);
        imageSrc = data.imageSrc || null;
        imgDims = data.imgDims || { w: 0, h: 0 };
        xCount = data.xCount || 40;
        yCount = data.yCount || 50;
        generated = Boolean(imageSrc);
        pieceSrc = data.pieceSrc || null;
      }
    } catch (e) {
      // kein gespeichertes Projekt vorhanden
    } finally {
      xCountInput.value = xCount;
      yCountInput.value = yCount;
      updateTotal();
      refreshImageUI();
      refreshPieceUI();
      updateSearchBtnState();
      if (generated && imageSrc) {
        gridImg.src = imageSrc;
        drawGridOverlay();
            gridSection.hidden = false;
        saveBtn.disabled = false;
      }
      loadingScreen.hidden = true;
      mainApp.hidden = false;
    }
  })();
})();
</script>
</body>
